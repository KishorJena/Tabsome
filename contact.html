<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tabsome</title>
    <meta name="description" content="Get in touch with the Tabsome team. Send us an email or connect on social media.">

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/assets/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/assets/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/assets/favicon-128x128.png" sizes="128x128">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="assets/css/tailwind.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Centralized API Configuration & Auth -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #9333ea;
            background-image:
                linear-gradient(180deg, rgba(17, 24, 39, 0.35) 0%, rgba(15, 23, 42, 0.45) 100%),
                linear-gradient(to right, #ff5757, #8c52ff);
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #ffffff;
            position: relative;
        }

        header,
        section,
        main,
        footer {
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px) saturate(0.8);
            -webkit-backdrop-filter: blur(16px) saturate(0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 16px 48px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .social-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .social-chip:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="text-white font-sans flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="fixed w-full backdrop-blur-sm z-50" style="background-color: rgba(55, 71, 79, 0.9);">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="assets/logo-white.png" alt="Tabsome Logo" class="w-8 h-8">
                <span class="text-2xl font-bold">Tabsome</span>
            </a>
            <nav class="space-x-8 hidden md:flex items-center">
                <a href="widgets.html" class="hover:text-gray-200 transition text-sm">Widgets</a>
                <a href="roadmap.html" class="hover:text-gray-200 transition text-sm">Roadmap</a>
                <a href="changelogs.html" class="hover:text-gray-200 transition text-sm">Changelogs</a>
            </nav>
            <div class="flex items-center space-x-3">
                <div id="tabsomeAuthNav" class="inline-flex items-center"></div>
            </div>
        </div>
    </header>

    <!-- Header Intro -->
    <section class="pt-32 pb-6 text-center flex-shrink-0">
        <div class="max-w-4xl mx-auto px-6" data-aos="fade-up">
            <div
                class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 border border-white/20 text-xs font-semibold uppercase tracking-wider mb-3">
                <i class="fas fa-headset text-yellow-300"></i>
                <span>Get in Touch</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3 tracking-tight text-white">
                Contact Us
            </h1>
            <p class="text-sm md:text-base text-gray-300 max-w-2xl mx-auto">
                Have questions, feedback, inquiries, or just want to connect? We'd love to hear from you.
            </p>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="py-4 pb-16 flex-grow">
        <div class="max-w-2xl mx-auto px-6" data-aos="fade-up" data-aos-delay="100">
            <div class="glass-card rounded-2xl p-6 md:p-8 space-y-6">
                <!-- Direct Email Card -->
                <div>
                    <h2 class="text-xs font-bold text-white/60 uppercase tracking-wider mb-3">Email Support</h2>
                    <a href="mailto:tabsome.app@gmail.com"
                        class="flex items-center justify-between gap-4 p-4 rounded-xl social-chip group">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div
                                class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center flex-shrink-0 text-blue-400 group-hover:text-blue-300 transition">
                                <i class="fas fa-envelope text-lg"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="text-xs text-white/60 font-medium">Direct Email</div>
                                <div class="text-base font-semibold text-white truncate">tabsome.app@gmail.com</div>
                            </div>
                        </div>
                        <i
                            class="fas fa-arrow-up-right-from-square text-xs text-white/40 group-hover:text-white transition mr-1"></i>
                    </a>
                </div>

                <!-- Divider -->
                <div class="border-t border-white/10"></div>

                <!-- Social Channels -->
                <div>
                    <h2 class="text-xs font-bold text-white/60 uppercase tracking-wider mb-3">Social Channels</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <!-- X (Twitter) -->
                        <a href="https://x.com/kishorjena01" target="_blank" rel="noopener noreferrer"
                            class="social-chip flex items-center gap-3 p-3.5 rounded-xl group">
                            <img src="assets/social/x.svg" alt="X (Twitter)"
                                class="w-5 h-5 opacity-80 group-hover:opacity-100 transition">
                            <span class="text-sm font-medium text-white/90 group-hover:text-white">Twitter / X</span>
                        </a>

                        <!-- Instagram -->
                        <a href="https://instagram.com/kishorjena01" target="_blank" rel="noopener noreferrer"
                            class="social-chip flex items-center gap-3 p-3.5 rounded-xl group">
                            <img src="assets/social/instagram.svg" alt="Instagram"
                                class="w-5 h-5 opacity-80 group-hover:opacity-100 transition">
                            <span class="text-sm font-medium text-white/90 group-hover:text-white">Instagram</span>
                        </a>

                        <!-- LinkedIn -->
                        <a href="https://linkedin.com/in/kishorjena" target="_blank" rel="noopener noreferrer"
                            class="social-chip flex items-center gap-3 p-3.5 rounded-xl group">
                            <img src="assets/social/in.png" alt="LinkedIn"
                                class="w-5 h-5 opacity-80 group-hover:opacity-100 transition">
                            <span class="text-sm font-medium text-white/90 group-hover:text-white">LinkedIn</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-gray-300 text-sm border-t border-white/10 mt-auto">
        <div class="flex justify-center items-center space-x-4 text-xs">
            <span>© 2025 Tabsome.</span>
            <a href="privacy.html" class="hover:text-white transition-colors underline">Privacy Policy</a>
            <span>•</span>
            <a href="contact.html" class="text-white hover:underline transition-colors font-medium">Contact</a>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });
        if (window.TabsomeAuth) {
            TabsomeAuth.initNavbarAuth('tabsomeAuthNav');
        }
    </script>
</body>

</html>
